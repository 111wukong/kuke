# ══════════════════════════════════════════════════════════════
# 库课 · Nginx 反向代理配置
#
# 放在 /etc/nginx/conf.d/kuke.conf（Debian/Ubuntu）
# 或 /etc/nginx/conf.d/kuke.conf（RHEL 系）
#
# 职责分工（想清楚这个，才不会两边打架）：
#   Nginx  → TLS 终止、HTTP→HTTPS 跳转、连接层限流、gzip
#   Node   → 业务限流、会话、CSP 等安全响应头、静态资源缓存头
# 安全头**只在应用里发**，这里不重复 —— 两处都写迟早会漂移。
#
# 证书用 certbot 申请：
#   sudo certbot --nginx -d kuke.example.edu
# ══════════════════════════════════════════════════════════════

# ── 连接层限流 ──────────────────────────────────────────────
# 注意：这里按 IP 限的是**连接建立速率**，不是请求数。
# 它的作用是挡住 SYN 洪泛和脚本扫端口，不要拿它做业务限流 ——
# 学生都在机房时出口 IP 相同，业务限流在应用层按用户分桶才正确。
limit_req_zone $binary_remote_addr zone=kuke_conn:10m rate=30r/s;

upstream kuke_app {
    server 127.0.0.1:5180;

    # 保持长连接，减少握手开销
    keepalive 32;
    keepalive_timeout 60s;
}

# ── HTTP：全部跳到 HTTPS ────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name kuke.example.edu;

    # certbot 的验证路径要放行，否则续期会失败
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ───────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kuke.example.edu;

    # ★ 证书路径按 certbot 的实际输出改
    ssl_certificate     /etc/letsencrypt/live/kuke.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kuke.example.edu/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 注意：HSTS 由应用在检测到 https 时下发（server/src/index.js）。
    # 这里**不要**再发一遍 —— 两处都发时，改一处会静默失效。

    # 上传体积。应用侧 bodyLimit 是 4MB，这里给到 8MB 留余量。
    # 反过来的话，超限时 Nginx 直接回 413 英文页，而应用的中文提示根本没机会出现。
    client_max_body_size 8m;

    # 慢连接防护
    client_body_timeout 30s;
    client_header_timeout 15s;

    # gzip。Node 侧没开压缩（交给反代更省 CPU），所以这里必须有，
    # 否则那个 342KB 的 charts chunk 是原样传输的。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml+rss
        application/rss+xml image/svg+xml
        application/wasm;

    access_log /var/log/nginx/kuke.access.log;
    error_log  /var/log/nginx/kuke.error.log warn;

    # ── AI 课堂：SSE 流式 ──────────────────────────────────
    # ★ 这一段必须单独写。SSE 走通用代理配置的话，
    #   Nginx 默认会缓冲响应，逐字输出变成「憋很久然后一次性全出来」。
    #   症状很迷惑：本地 npm start 直连一切正常，一上反代流式就废了。
    #   应用已经发了 X-Accel-Buffering: no，这里再关一次缓冲作为双保险。
    location /api/ai/ {
        proxy_pass http://kuke_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        '';

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        # AI 生成可能持续几十秒（多轮对话 + 跑 SQL）。
        # 默认 60s 会在学生等结果时把连接掐断。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # SSE 是长连接，不适用连接层限流
        limit_req off;
    }

    # ── 其余全部走应用 ─────────────────────────────────────
    location / {
        limit_req zone=kuke_conn burst=60 nodelay;

        proxy_pass http://kuke_app;
        proxy_http_version 1.1;

        # ★ X-Forwarded-For 是应用侧 TRUST_PROXY 的输入。
        #   应用会用它算 req.ip，而限流、审计日志全靠这个值。
        #   反过来：如果应用没设 TRUST_PROXY，这些头会被忽略，
        #   所有请求都会被记成 127.0.0.1。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        '';

        # 判题超时是 4 秒，但一次提交要等 worker 排队，
        # 公网 RTT 也要算进去。60s 足够，同时能挡住挂死的连接。
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # 不缓冲响应 —— 应用的 Cache-Control 才能原样传到浏览器
        proxy_buffering off;
    }

    # ── 静态资源 ───────────────────────────────────────────
    # 让 Nginx 直接服务构建产物，绕开 Node：
    # 省一次进程间转发，而且 Nginx 发静态文件比 Node 快得多。
    # 缓存头仍然由应用在打包时确定（文件名带内容哈希），
    # 这里只做「告诉 Nginx 它可以直接发」。
    #
    # ★ 注意：如果没把 web/dist 同步到服务器上（比如只用 Docker 跑），
    #   就删掉这个 location，让请求继续走上面的 location /。
    location /assets/ {
        alias /srv/kuke/web/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }
}

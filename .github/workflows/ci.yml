name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # better-sqlite3 v13 自带全平台预编译产物，不需要编译工具链
      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 构建前端
        run: npm run build

      # 内容自检排在最前 —— 它最快（0.1s），而且它失败说明
      # 是内容配错了（比如某关的参考答案跑不通），不是代码问题。
      # 这类错误如果留到后面几组才暴露，会被淹没在一堆失败里。
      - name: 内容自检
        run: npm run test:content

      - name: 单元测试
        run: npm run test:unit

      - name: 接口冒烟
        run: npm run test:api

      - name: 加固回归
        run: npm run test:hardening

      # ★ 主题对比度 + 古风字体。
      #
      #   这两组都是**纯静态**（只读 CSS / 资产文件，不起服务，秒级），
      #   所以放在这里几乎没有成本。
      #
      #   它们守的是同一类东西：**不会报错、不会让截图变难看的缺陷**。
      #   对比度低了页面照样渲染，字体掉回黑体截图照样清晰 ——
      #   只是学生看不清 / 古风没了。
      #
      #   ★ 这两个脚本以前**没接进 CI**（只写在 tests/run-all.mjs 里，
      #     而 CI 是逐步列 npm script 的，漏掉了它们）。后果很实在：
      #     古风主题「砚秋」的文字色是深色压在深色底上（1.50:1，
      #     基本看不见），CI 全绿、PR 全绿，一直到有人肉眼看才发现。
      #     测试写了不跑，等于没写。
      - name: 主题对比度
        run: npm run test:contrast

      - name: 古风字体
        run: npm run test:fonts

      # 开场 3D 背景的着色器数学。纯静态、不需要 GPU ——
      # 它守的是"着色器不报错但画面少了一块"这类缺陷（实测踩过两次）。
      - name: 开场 3D 着色器
        run: npm run test:fx

      # AI 套件不打真模型 —— 用 mock 的 OpenAI 兼容上游，确定且不烧钱。
      - name: AI 纯函数
        run: npm run test:ai-unit

      - name: AI 端到端
        run: npm run test:ai-e2e

      # 浏览器测试在 CI 上跑 Ubuntu 的 Chrome，和本机不是同一个内核 ——
      # 所以它**单独一个 job**，失败不影响上面的结论，
      # 但会在 PR 上明确标红，避免「本机绿、CI 红」被忽略。
      - name: 上传构建产物（供 browser job 使用）
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  browser:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      # ★ 装中文字体。Ubuntu runner 默认没有 CJK 字体，
      #   不装的话所有汉字在截图里都是「豆腐块」—— 19 张实拍图全废。
      #   这一步只影响 browser job（test job 不截图）。
      - name: 安装中文字体
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      # Ubuntu runner 自带 Chrome。显式钉住路径，
      # 避免"本机和 CI 解析到不同内核"导致的诡异差异。
      - name: 浏览器冒烟 + 截图
        env:
          KUKE_BROWSER: /usr/bin/google-chrome
        run: npm run test:browser

      # ★ AI 课堂的浏览器冒烟单开一步。它同样需要 Chrome 和中文字体，
      #   跑不了会**明确跳过**（退出码 0 + 一行说明），不假装通过。
      - name: AI 课堂冒烟
        run: npm run test:browser:ai

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots
          retention-days: 7
          if-no-files-found: ignore

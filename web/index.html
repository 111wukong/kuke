<!doctype html>
<html lang="zh-CN" data-theme="deep-space">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>库课 · 数据库课程学习平台</title>
    <meta name="description" content="面向高校师生的数据库课程学习平台：知识树、SQL 实训场、范式实验室、索引与事务实验台、作业与学情分析。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305060c'/%3E%3Cellipse cx='16' cy='10' rx='9' ry='4' fill='none' stroke='%2322d3ee' stroke-width='2'/%3E%3Cpath d='M7 10v12c0 2.2 4 4 9 4s9-1.8 9-4V10' fill='none' stroke='%2322d3ee' stroke-width='2'/%3E%3Cpath d='M7 16c0 2.2 4 4 9 4s9-1.8 9-4' fill='none' stroke='%23a855f7' stroke-width='2'/%3E%3C/svg%3E" />
    <script>
      /* ★ 首屏防闪。这段脚本必须在 bundle 和样式表之前跑完 ——
       * 它把上次选的主题挂到 <html data-theme> 上，
       * 这样 CSS 一到位颜色就是对的。
       *
       * 如果交给 React 在挂载后设主题，用户会先看到默认主题（深空），
       * 再"啪"地跳成宣纸 —— 而且这个闪变在测试里查不出来，
       * 因为测试里的主题是点出来的，store 早就是同步的了。
       *
       * 这也是 CSP 里必须留 'unsafe-inline' 的原因：用哈希的话，
       * 每次改这段脚本都要同步改响应头，对单人维护的项目是纯负债。 */
      (function () {
        try {
          var t = localStorage.getItem('kuke:theme');
          if (t) document.documentElement.setAttribute('data-theme', t);
          /* ★ 网格背景只在开了 fx 的主题上挂。这里必须同步设 ——
           *   否则切到克制的主题时会先闪一下满屏方格网。
           *   只有赛博绿一个主题开 fx，所以这里直接判等，
           *   不引主题注册表（那会把 bundle 提前拉进来，得不偿失）。 */
          document.documentElement.setAttribute(
            'data-fx', (t === 'cyber-lime') ? 'on' : 'off');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

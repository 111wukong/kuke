<?xml version="1.0" encoding="UTF-8"?>
<!--
  山水中卷轴轴头
  - 两端「卷」起的轴头，主体是一根暖棕横线
  - 用 currentColor 控制主色（CSS 里设 #8a6a3a）
  - 用法：<svg ... class="text-[#8a6a3a]"> 或 CSS 注入
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 16" fill="none" aria-hidden="true">
  <!-- 左轴头：同心圆螺旋 -->
  <g stroke="currentColor" stroke-width="1" fill="none" opacity="0.85">
    <ellipse cx="6" cy="8" rx="5.5" ry="7"/>
    <ellipse cx="6" cy="8" rx="3" ry="4.5"/>
    <ellipse cx="6" cy="8" rx="1" ry="1.5"/>
  </g>
  <!-- 右轴头 -->
  <g stroke="currentColor" stroke-width="1" fill="none" opacity="0.85">
    <ellipse cx="234" cy="8" rx="5.5" ry="7"/>
    <ellipse cx="234" cy="8" rx="3" ry="4.5"/>
    <ellipse cx="234" cy="8" rx="1" ry="1.5"/>
  </g>
  <!-- 中间轴身：双线，模拟竹简/卷轴的纸边 -->
  <line x1="14" y1="8" x2="226" y2="8" stroke="currentColor" stroke-width="1.2" opacity="0.55"/>
  <line x1="14" y1="10" x2="226" y2="10" stroke="currentColor" stroke-width="0.5" opacity="0.30"/>
</svg>

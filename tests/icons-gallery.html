<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>国风图标预览（自包含）</title>
<style>
  body { margin: 0; padding: 24px; background: #f4ecd5; color: #1f1408; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", serif; }
  h1 { margin: 0 0 8px; font-size: 22px; }
  .desc { color: #75603d; margin-bottom: 24px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 1100px; }
  .cell { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: rgba(255,255,255,0.45); border-radius: 8px; border: 1px solid rgba(90,62,30,0.15); }
  .cell .label { font-size: 13px; font-weight: 500; line-height: 1.3; }
  .cell .meta { font-size: 10.5px; color: #75603d; margin-top: 2px; font-family: monospace; }
  .cell .icons { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  .cell .icons svg { color: #1f1408; }
  .cell .icons svg.cyan { color: #3a6b5b; }
  .cell .icons svg.rose { color: #9c2619; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 8px; background: #9c2619; color: #f4ecd5; font-size: 10px; margin-left: 6px; vertical-align: middle; }
</style>
</head>
<body>
<h1>国风图标预览 <span class="badge">16 枚</span></h1>
<div class="desc">每格三枚：默认（墨色 16px）· 激活（青绿 18px）· 朱砂批注（9c2619 24px）· 右下角灰字是英文名</div>
<div class="grid" id="grid"></div>

  official:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="1" transform="rotate(45 12 12)"/><rect x="4.5" y="4.5" width="15" height="15" rx="1" opacity="0.3"/><path d="M12 8 L12 16 M8 12 L16 12" opacity="0.5"/></svg>',

const LABELS = {
  compass: '仪表盘 → 罗盘',
  branches: '知识树 → 枝叶',
  scroll: 'AI 课堂 → 书卷',
  bamboo: 'SQL 实训场 → 竹简',
  token: 'SQL 闯关 → 令箭',
  brush: '每日一练 → 毛笔',
  balance: '范式实验室 → 天平',
  gourd: '索引与事务 → 葫芦',
  meander: '复习队列 → 回纹',
  vermilion: '错题本 → 朱批',
  trigram: '学习统计 → 卦象',
  jadebi: '成就 → 玉璧',
  taiji: '设置 → 太极',
  document: '作业 → 文牒',
  academy: '班级 → 学塾匾',
  official: '教师工作台 → 官印',
};

const grid = document.getElementById('grid');
Object.entries(LABELS).forEach(([k, label]) => {
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.innerHTML = `
    <div class="icons">
      ${ICONS[k].replace('<svg ', '<svg width="16" height="16" ')}
      ${ICONS[k].replace('<svg ', '<svg width="18" height="18" class="cyan" ')}
      ${ICONS[k].replace('<svg ', '<svg width="24" height="24" class="rose" ')}
    </div>
    <div>
      <div class="label">${label}</div>
      <div class="meta">${k}</div>
    </div>
  `;
  grid.appendChild(cell);
});
</script>
</body>
</html>
